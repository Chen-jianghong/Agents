appId: com.multiagent.dev
productName: Multi-Agent Dev
directories:
  output: apps/desktop/release
  buildResources: apps/desktop/build
files:
  - dist/src/**/*
  - apps/desktop/dist-electron/**/*
  - apps/desktop/dist-renderer/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Multi-Agent Dev
electronLanguages:
  - zh-CN
  - en-US
